services:
  inventorymanagement:
    image: inventorymanagement
    build:
      context: .
      dockerfile: InventoryManagement/Dockerfile
    depends_on:
      - postgres
    ports:
      - "8080:8080"
      - "8081:8081"
      
  postgres:
    image: postgres:17-alpine
    container_name: inventorymanagement-db
    environment:
      POSTGRES_DB: inventory_dev
      POSTGRES_USER: inventory_user
      POSTGRES_PASSWORD: inventory_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
